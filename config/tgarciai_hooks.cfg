# tgarciai hooks for Simple AF
#
# Include from printer.cfg with:
#   [include tgarciai_hooks.cfg]
#
# Prime before the line purge: with the nozzle already at print temperature, extrude off the print area
# so the ooze blob ends up there, scrub the nozzle hot on the K1C brush, and only then do the line purge.
# Without this the blob from heating is left at the start of the purge and can be dragged into the print.

[gcode_macro _SAF_START_PRINT_BEFORE_LINE_PURGE]
description: Prime off the print area and scrub the nozzle hot on the brush before the line purge
# prime position, outside the 220x220 print area (back right corner)
variable_prime_x: 229
variable_prime_y: 227
# nozzle height while priming, in mm
variable_prime_z: 3.0
# filament to extrude while priming, in mm
variable_prime_amount: 15
# extrusion speed while priming, in mm/s of filament
variable_prime_speed: 3
# retract after priming, in mm
variable_prime_retract: 0.8
# seconds to wait after priming so the ooze finishes
variable_prime_dwell: 3
# hot brush scrub passes, 0 disables the scrub
variable_brush_passes: 6
gcode:
    {% set v = printer["gcode_macro _SAF_START_PRINT_BEFORE_LINE_PURGE"] %}
    {% set state = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"] %}
    {% set wipe = printer["gcode_macro _LOAD_CELL_WIPE_VARIABLES"] %}
    {% set passes = v.brush_passes | int %}
    {% set brush = wipe.k1c_brush and state.done and passes > 0 %}
    {% set mesh = printer.bed_mesh.profile_name %}
    {% set lift = [printer.toolhead.position.z, v.prime_z + 5] | max %}

    SAVE_GCODE_STATE NAME=_tg_prime
    G90
    M83

    RESPOND TYPE=command MSG="Prime: extruding {v.prime_amount}mm at {v.prime_x}, {v.prime_y}"
    G1 Z{lift} F1200
    G1 X{v.prime_x} Y{v.prime_y} F12000
    G1 Z{v.prime_z} F600
    G1 E{v.prime_amount} F{v.prime_speed * 60}
    G1 E-{v.prime_retract} F2100
    G4 P{v.prime_dwell * 1000}

    {% if brush %}
      # the brush heights come from the load cell wipe taps, which were measured without a bed mesh
      {% set depth = wipe.brush_depth %}
      {% set sx, ex, y = 87, 133, 225 %}
      {% set zs = state.src_z - depth %}
      {% set ze = state.end_z - depth %}
      RESPOND TYPE=command MSG="Prime: scrubbing brush hot, {passes} passes"
      BED_MESH_CLEAR
      M106 S0
      G1 Z{state.end_z + 2} F1200
      G1 X{ex - 5} Y{y} F12000
      G1 Z{ze} F300
      {% for i in range(passes) %}
        G1 X{sx + 5} Y{y} Z{zs} F6000
        G1 X{ex - 5} Y{y} Z{ze} F6000
      {% endfor %}
      # pull forward off the brush before lifting, like the stock wipe
      G1 Y{y - 4} F6000
      G1 Z{state.end_z + 5} F1200
      {% if mesh %}
        BED_MESH_PROFILE LOAD="{mesh}"
      {% endif %}
    {% else %}
      G1 Z{lift} F1200
    {% endif %}

    RESTORE_GCODE_STATE NAME=_tg_prime
