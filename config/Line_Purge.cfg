# copied and slightly modified from https://raw.githubusercontent.com/kyleisah/Klipper-Adaptive-Meshing-Purging/refs/heads/main/Configuration/Line_Purge.cfg
[gcode_macro _LINE_PURGE]
description: A purge macro that adapts to be near your actual printed objects
gcode:
    {% set travel_speed = (printer.toolhead.max_velocity) * 30 | float %}
    {% set z_height = printer["gcode_macro _KAMP_Settings"].line_purge_z_hop | float %}
    {% set purge_height = printer["gcode_macro _KAMP_Settings"].purge_height | float %}
    {% set tip_distance = printer["gcode_macro _KAMP_Settings"].tip_distance | float %}
    {% set purge_margin = printer["gcode_macro _KAMP_Settings"].purge_margin | float %}
    {% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}
    {% set retract_amount = printer["gcode_macro _KAMP_Settings"].line_purge_retract | float %}
    {% set retract_speed = (printer["gcode_macro _KAMP_Settings"].line_purge_retract_speed * 60) | float %}
    {% set flow_rate = printer["gcode_macro _KAMP_Settings"].flow_rate | float %}
    {% set purge_lines = printer["gcode_macro _KAMP_Settings"].get('purge_lines', 1) | int %}                  # Number of parallel purge lines
    {% set line_spacing = printer["gcode_macro _KAMP_Settings"].get('purge_line_spacing', 1.2) | float %}      # Distance between purge lines
    {% set line_amount = purge_amount / purge_lines %}                                                       # Filament per line, total stays purge_amount
    {% set edge_margin = printer["gcode_macro _KAMP_Settings"].get('purge_edge_margin', 0) | float %}         # Keep every purge line this far from the bed edge
    {% set purge_band = (purge_lines - 1) * line_spacing %}                                                  # Width of the zigzag band
    {% set wipe_length = [printer["gcode_macro _KAMP_Settings"].get('purge_wipe_length', 15) | float, purge_amount] | min %}  # Wipe back along the last line
    {% set wipe_speed = 6000 %}                                                                              # Wipe speed in mm/min

    # Calculate purge origins and centers from objects
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}    # Get all object points
    {% set x_min = ([printer.configfile.settings['stepper_x'].position_min | float, 0] | max) %}                     # X axis position_min, but never below 0
    {% set y_min = ([printer.configfile.settings['stepper_y'].position_min | float, 0] | max) %}                     # Y axis position_min, but never below 0
    {% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}                          # Object x min
    {% set purge_x_max = (all_points | map(attribute=0) | max | default(0)) %}                          # Object x max
    {% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}                          # Object y min
    {% set purge_y_max = (all_points | map(attribute=1) | max | default(0)) %}                          # Object y max

    {% set purge_x_center = ([((purge_x_max + purge_x_min) / 2) - (purge_amount / 2), x_min] | max) %}      # Create center point of purge line relative to print on X axis
    {% set purge_y_center = ([((purge_y_max + purge_y_min) / 2) - (purge_amount / 2), y_min] | max) %}      # Create center point of purge line relative to print on Y axis

    {% set purge_x_origin = ([purge_x_min - purge_margin, x_min + edge_margin + purge_band] | max) %}       # Add margin to x min, keep the whole band inside the edge margin
    {% set purge_y_origin = ([purge_y_min - purge_margin, y_min + edge_margin + purge_band] | max) %}       # Add margin to y min, keep the whole band inside the edge margin

    {% set purge_move_speed = (flow_rate / 5.0) * 60 * purge_lines | float %}                               # Thinner lines, same flow rate

    {% if purge_y_origin > y_min + edge_margin + purge_band %}
        {action_respond_info("Line purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(
            (purge_x_center),
            (purge_y_origin),
            (purge_amount),
            (flow_rate),
        )) }
    {% else %}
        {action_respond_info("Line purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(
            (purge_x_origin),
            (purge_y_center),
            (purge_amount),
            (flow_rate),
        )) }
    {% endif %}

    SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

    {% if purge_y_origin > y_min + edge_margin + purge_band %}                                                             # If there's room on Y, purge along X axis in front of print area
        G92 E0                                                                              # Reset extruder
        G0 F{travel_speed}                                                                  # Set travel speed
        G90                                                                                 # Absolute positioning
        G0 X{purge_x_center} Y{purge_y_origin}                                              # Move to purge position
        G0 Z{purge_height}                                                                  # Move to purge Z height
        M83                                                                                 # Relative extrusion mode
        {% for i in range(purge_lines) %}                                                   # Zigzag lines, stepping away from the print
          {% if i > 0 %}
            G1 Y{[purge_y_origin - i * line_spacing, y_min] | max} F{purge_move_speed}      # Step to the next line
          {% endif %}
          G1 X{purge_x_center + (purge_amount if i % 2 == 0 else 0)} E{line_amount + (tip_distance if i == 0 else 0)} F{purge_move_speed}  # Purge line, the first one also restores the filament tip while moving (no blob)
        {% endfor %}
        {% set end_x = purge_x_center + (purge_amount if purge_lines % 2 == 1 else 0) %}
        G1 E-{retract_amount} F{retract_speed}                                              # Retraction at end
        G1 X{end_x + (-wipe_length if purge_lines % 2 == 1 else wipe_length)} F{wipe_speed}  # Wipe back over the last line so the string sticks to the purge
        G92 E0                                                                              # Reset extruder distance
        M82                                                                                 # Absolute extrusion mode
        G0 Z{z_height} F{travel_speed}                                                      # Z hop
    {% else %}                                                                              # If there's room on X, purge along Y axis to the left of print area
        G92 E0                                                                              # Reset extruder
        G0 F{travel_speed}                                                                  # Set travel speed
        G90                                                                                 # Absolute positioning
        G0 X{purge_x_origin} Y{purge_y_center}                                              # Move to purge position
        G0 Z{purge_height}                                                                  # Move to purge Z height
        M83                                                                                 # Relative extrusion mode
        {% for i in range(purge_lines) %}                                                   # Zigzag lines, stepping away from the print
          {% if i > 0 %}
            G1 X{[purge_x_origin - i * line_spacing, x_min] | max} F{purge_move_speed}      # Step to the next line
          {% endif %}
          G1 Y{purge_y_center + (purge_amount if i % 2 == 0 else 0)} E{line_amount + (tip_distance if i == 0 else 0)} F{purge_move_speed}  # Purge line, the first one also restores the filament tip while moving (no blob)
        {% endfor %}
        {% set end_y = purge_y_center + (purge_amount if purge_lines % 2 == 1 else 0) %}
        G1 E-{retract_amount} F{retract_speed}                                              # Retraction at end
        G1 Y{end_y + (-wipe_length if purge_lines % 2 == 1 else wipe_length)} F{wipe_speed}  # Wipe back over the last line so the string sticks to the purge
        G92 E0                                                                              # Reset extruder distance
        M82                                                                                 # Absolute extrusion mode
        G0 Z{z_height} F{travel_speed}                                                      # Z hop
    {% endif %}

    RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state
